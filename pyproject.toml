[project]
name = "tooja"
version = "0.1.0"
description = "Unified Python client for Korean securities brokers — common abstraction with raw interface escape hatch"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Youngchan Kim", email = "cookieshake.dev@gmail.com" }
]
requires-python = ">=3.13"
keywords = ["kis", "korea-investment", "securities", "broker", "trading", "stock", "ccxt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.9",
    "platformdirs>=4.3",
    "websockets>=13",
]

[project.urls]
Homepage = "https://github.com/cookieshake/tooja"
Repository = "https://github.com/cookieshake/tooja"
Issues = "https://github.com/cookieshake/tooja/issues"

[project.optional-dependencies]
mcp = ["mcp>=1.2"]

[project.scripts]
tooja-mcp = "tooja.mcp.__main__:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "pyright>=1.1.390",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
    "mkdocs-llmstxt>=0.2",
    "ruff>=0.8",  # mkdocstrings 시그니처 포매팅
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint.per-file-ignores]
# OHLC mappers use the conventional o/h/l/c locals, and interleave raw-model
# imports with converters by design.
"src/tooja/brokers/kis/_mappers.py" = ["E741", "E402"]
"src/tooja/brokers/kis/stream.py" = ["E402"]
# Auto-generated raw spec models (see specs/) — not hand-maintained.
"src/tooja/brokers/kis/raw/**" = ["F811"]
# Tests use compact idioms: imports after setup, semicolon one-liners, and
# bound-but-unasserted locals for readability.
"tests/**" = ["E402", "E702", "F841"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "basic"

[tool.coverage.run]
source = ["src/tooja"]
branch = true
omit = [
    # Auto-generated raw endpoint executors/models (hundreds of files); the
    # hand-written common API and portfolio code are what coverage gates on.
    "src/tooja/brokers/*/raw/*",
    "src/tooja/brokers/*/raw/**/*",
    "src/tooja/brokers/*/raw_namespace.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
